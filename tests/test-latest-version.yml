name: Test latest version on clean code
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # The latest SwiftLint Linux binary requires GLIBC >= 2.38. Determine whether
      # this container can run it so we know which outcome to expect.
      - id: glibc
        name: Detect glibc version
        run: |
          ver="$(ldd --version 2>&1 | head -n1 | grep -oE '[0-9]+\.[0-9]+' | tail -n1)"
          echo "glibc: $ver"
          major="${ver%%.*}"; minor="${ver##*.}"
          if [ "$major" -gt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -ge 38 ]; }; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: latest
          args: tests/fixtures/clean
      - name: Assert outcome matches platform capability
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SUPPORTED: ${{ steps.glibc.outputs.supported }}
        run: |
          echo "outcome: $OUTCOME, glibc supported: $SUPPORTED"
          if [ "$SUPPORTED" = "true" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "FAIL: expected success for clean Swift code with latest version"
              exit 1
            fi
            echo "PASS: latest SwiftLint linted clean code successfully"
          else
            if [ "$OUTCOME" != "failure" ]; then
              echo "FAIL: expected failure (latest binary cannot run on old glibc), got '$OUTCOME'"
              exit 1
            fi
            echo "PASS: latest was downloaded but cannot run on this glibc; action failed as expected"
          fi
      - name: Assert latest was not cached in tool cache
        run: |
          base="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          if [ -d "$base/swiftlint-linux/latest" ]; then
            echo "FAIL: 'latest' should not be cached"
            exit 1
          fi
          echo "PASS"
