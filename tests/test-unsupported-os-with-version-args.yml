name: Test unsupported OS with explicit version and args
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 0.54.0
          args: --strict --quiet
      - name: Assert action fails on non-darwin platform without caching a tool
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$(uname -s)" = "Darwin" ]; then
            echo "Running on macOS; skipping unsupported-OS assertion"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on $(uname -s), got '$OUTCOME'"
            exit 1
          fi
          CACHE="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          if ls -d "$CACHE"/swiftlint-* >/dev/null 2>&1; then
            echo "FAIL: swiftlint was cached even though OS is unsupported"
            ls -la "$CACHE"
            exit 1
          fi
          echo "PASS: action rejected unsupported OS before downloading"
