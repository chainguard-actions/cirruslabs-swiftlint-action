name: Test warning-only violation fails with --strict
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Seed tool cache with a stub SwiftLint honoring --strict
        run: |
          CACHE="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          DIR="$CACHE/swiftlint-linux/0.59.1-stricttest/x64"
          rm -rf "$DIR" "$DIR.complete"
          mkdir -p "$DIR"
          cat > "$DIR/swiftlint" <<'EOF'
          #!/bin/sh
          echo "$@" > /tmp/swiftlint-stricttest-args.txt
          echo '[{"file":"tests/fixtures/warning/Counter.swift","line":3,"character":20,"severity":"Warning","type":"Trailing Semicolon","rule_id":"trailing_semicolon","reason":"Lines should not have trailing semicolons"}]'
          for a in "$@"; do
            if [ "$a" = "--strict" ]; then exit 3; fi
          done
          exit 0
          EOF
          chmod +x "$DIR/swiftlint"
          touch "$DIR.complete"
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 0.59.1-stricttest
          args: --strict tests/fixtures/warning
      - name: Assert lint failed under strict mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when warnings are treated as errors"
            exit 1
          fi
          ARGS="$(cat /tmp/swiftlint-stricttest-args.txt)"
          echo "args: $ARGS"
          if [ "$ARGS" != "lint --reporter=json --strict tests/fixtures/warning" ]; then
            echo "FAIL: unexpected args passed to swiftlint"
            exit 1
          fi
          echo "PASS"
