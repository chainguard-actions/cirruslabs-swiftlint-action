name: Test error-level violation fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Seed tool cache with a stub SwiftLint reporting an error
        run: |
          CACHE="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          DIR="$CACHE/swiftlint-linux/0.59.1-errortest/x64"
          rm -rf "$DIR" "$DIR.complete"
          mkdir -p "$DIR"
          cat > "$DIR/swiftlint" <<'EOF'
          #!/bin/sh
          echo "$@" > /tmp/swiftlint-errortest-args.txt
          echo '[{"file":"tests/fixtures/error/Converter.swift","line":3,"character":20,"severity":"Error","type":"Force Cast","rule_id":"force_cast","reason":"Force casts should be avoided"}]'
          exit 2
          EOF
          chmod +x "$DIR/swiftlint"
          touch "$DIR.complete"
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: 0.59.1-errortest
          args: tests/fixtures/error
      - name: Assert lint failed due to force_cast error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for error-level violation"
            exit 1
          fi
          ARGS="$(cat /tmp/swiftlint-errortest-args.txt)"
          echo "args: $ARGS"
          if [ "$ARGS" != "lint --reporter=json tests/fixtures/error" ]; then
            echo "FAIL: unexpected args passed to swiftlint"
            exit 1
          fi
          echo "PASS"
