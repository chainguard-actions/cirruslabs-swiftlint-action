name: Test unsupported OS with default inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Show platform
        run: uname -s
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action fails on non-darwin platform
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$(uname -s)" = "Darwin" ]; then
            echo "Running on macOS; skipping unsupported-OS assertion"
            exit 0
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on $(uname -s), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action rejected unsupported OS"
